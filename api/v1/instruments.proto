syntax = "proto3";
package v1;

option go_package = "github.com/patrickmcm/finance-tracker-backend/api/v1";

import "google/protobuf/empty.proto";

service InstrumentsService {
  rpc Get(GetInstrumentRequest) returns (Instrument);
  rpc List(google.protobuf.Empty) returns (InstrumentCollection);
}

message GetInstrumentRequest {
  string ticker = 1;
}

message Instrument {
  string ticker = 1;
  string name = 2;
  string currency = 3;
  string isin = 4;

  enum InstrumentType {
    ETF = 0;
    STOCK = 1;
  }

  InstrumentType type = 5;
}

message InstrumentCollection {
  repeated Instrument instruments = 1;
}